name: TechBank CI/CD

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate build metadata
        id: meta
        run: |
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "git_sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: docker build -t techbank:ci .

      - name: Start container
        run: |
          docker run -d \
            --name techbank-ci \
            -e APP_VERSION=v1.0.0 \
            -e GIT_SHA=${{ steps.meta.outputs.git_sha }} \
            -e BUILD_TIME=${{ steps.meta.outputs.build_time }} \
            -e PIPELINE_VERSION=v1.0.0 \
            -e APP_ENV=ci \
            -p 3000:3000 \
            techbank:ci

      - name: Wait for container to be healthy
        run: |
          echo "Waiting for TechBank to be ready..."
          ATTEMPTS=0
          MAX_ATTEMPTS=20
          DELAY=3

          until [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Container is healthy after $((ATTEMPTS * DELAY)) seconds"
              break
            fi
            ATTEMPTS=$((ATTEMPTS + 1))
            echo "Attempt $ATTEMPTS/$MAX_ATTEMPTS — HTTP $STATUS — retrying in ${DELAY}s..."
            sleep $DELAY
          done

          if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
            echo "Container did not become healthy within timeout"
            echo "=== Container logs ==="
            docker logs techbank-ci
            exit 1
          fi

      - name: Smoke test /health
        run: |
          BODY=$(curl -sf http://localhost:3000/health)
          echo "Response: $BODY"
          echo "$BODY" | grep -q '"status"'

      - name: Smoke test /ready
        run: |
          BODY=$(curl -sf http://localhost:3000/ready)
          echo "Response: $BODY"
          echo "$BODY" | grep -q '"status"'

      - name: Smoke test /api/version
        run: |
          BODY=$(curl -sf http://localhost:3000/api/version)
          echo "Response: $BODY"
          echo "$BODY" | grep -q '"appVersion"'
          echo "$BODY" | grep -q '"gitSha"'
          echo "$BODY" | grep -q '"environment"'

      - name: Smoke test / (SPA HTML)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
          echo "GET / returned HTTP $STATUS"
          [ "$STATUS" = "200" ]

      - name: Smoke test /api/not-found returns 404
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/not-found || true)
          echo "GET /api/not-found returned HTTP $STATUS"
          [ "$STATUS" = "404" ]

      - name: Show container logs on failure
        if: failure()
        run: docker logs techbank-ci

      - name: Cleanup container
        if: always()
        run: |
          docker stop techbank-ci || true
          docker rm techbank-ci || true
