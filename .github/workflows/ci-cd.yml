name: TechBank CI/CD

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate build metadata
        id: meta
        run: |
          RAW_VER=$(tr -d '\r\n' < VERSION)
          echo "app_version=v${RAW_VER}" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
          echo "git_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "image_name=techbank:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: docker build -t ${{ steps.meta.outputs.image_name }} .

      - name: Start container
        run: |
          docker run -d \
            --name techbank-ci \
            -e APP_VERSION=${{ steps.meta.outputs.app_version }} \
            -e GIT_SHA=${{ steps.meta.outputs.git_sha }} \
            -e BUILD_TIME=${{ steps.meta.outputs.build_time }} \
            -e PIPELINE_VERSION=v1.0.0 \
            -e APP_ENV=ci \
            -e CONTAINER_IMAGE=${{ steps.meta.outputs.image_name }} \
            -p 3000:3000 \
            ${{ steps.meta.outputs.image_name }}

      - name: Wait for container to be ready
        run: |
          echo "Waiting for TechBank HTTP endpoint..."
          ATTEMPTS=0
          MAX_ATTEMPTS=20
          DELAY=3

          until [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Container HTTP endpoint responding after $((ATTEMPTS * DELAY)) seconds"
              break
            fi
            ATTEMPTS=$((ATTEMPTS + 1))
            echo "Attempt $ATTEMPTS/$MAX_ATTEMPTS — HTTP $STATUS — retrying in ${DELAY}s..."
            sleep $DELAY
          done

          if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
            echo "Container did not respond within timeout"
            echo "=== Container logs ==="
            docker logs techbank-ci
            exit 1
          fi

      - name: Verify Docker Healthcheck Status
        run: |
          echo "Verifying Docker container health status..."
          HEALTH_STATUS=$(docker inspect techbank-ci --format '{{json .State.Health.Status}}' | tr -d '"')
          echo "Initial health status: $HEALTH_STATUS"

          ATTEMPTS=0
          until [ "$HEALTH_STATUS" = "healthy" ] || [ $ATTEMPTS -ge 10 ]; do
            sleep 3
            HEALTH_STATUS=$(docker inspect techbank-ci --format '{{json .State.Health.Status}}' | tr -d '"')
            echo "Health status attempt $((ATTEMPTS+1)): $HEALTH_STATUS"
            ATTEMPTS=$((ATTEMPTS + 1))
          done

          [ "$HEALTH_STATUS" = "healthy" ]

      - name: Smoke test /health
        run: |
          BODY=$(curl -sf http://localhost:3000/health)
          echo "Response: $BODY"
          echo "$BODY" | grep -q '"status":"ok"'

      - name: Smoke test /ready
        run: |
          BODY=$(curl -sf http://localhost:3000/ready)
          echo "Response: $BODY"
          echo "$BODY" | grep -q '"status":"ready"'

      - name: Smoke test /api/version
        run: |
          BODY=$(curl -sf http://localhost:3000/api/version)
          echo "Response: $BODY"
          echo "$BODY" | grep -q '"appVersion":"${{ steps.meta.outputs.app_version }}"'
          echo "$BODY" | grep -q '"gitSha":"${{ steps.meta.outputs.git_sha }}"'
          echo "$BODY" | grep -q '"pipelineVersion":"v1.0.0"'
          echo "$BODY" | grep -q '"environment":"ci"'

      - name: Smoke test /api/releases
        run: |
          BODY=$(curl -sf http://localhost:3000/api/releases)
          echo "Response: $BODY"
          echo "$BODY" | grep -q '"appVersion":"${{ steps.meta.outputs.app_version }}"'
          echo "$BODY" | grep -q '"gitSha":"${{ steps.meta.outputs.git_sha }}"'
          echo "$BODY" | grep -q '"pipelineVersion":"v1.0.0"'
          echo "$BODY" | grep -q '"environment":"ci"'
          echo "$BODY" | grep -q '"containerImage":"${{ steps.meta.outputs.image_name }}"'
          echo "$BODY" | grep -q '"releaseStatus":"CI Validation"'

      - name: Smoke test / (SPA HTML)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
          echo "GET / returned HTTP $STATUS"
          [ "$STATUS" = "200" ]

      - name: Smoke test /api/not-found returns 404
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/not-found || true)
          echo "GET /api/not-found returned HTTP $STATUS"
          [ "$STATUS" = "404" ]

      - name: Show container logs on failure
        if: failure()
        run: docker logs techbank-ci

      - name: Cleanup container
        if: always()
        run: |
          docker stop techbank-ci || true
          docker rm techbank-ci || true
